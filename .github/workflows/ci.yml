name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: app_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app_password
          TZ: Asia/Tokyo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      # Clerk (Secrets)
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      # E2E admin (Secrets)
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      # test DB URL (CI)
      DATABASE_URL_TEST: mysql://app:app_password@127.0.0.1:3306/app_test

      # seed が admin 候補を作るなら（必要な場合のみ）
      ADMIN_EMAILS: ${{ secrets.E2E_ADMIN_EMAIL }}

      # Next/Playwright が localhost を見る前提（あなたの baseURL に合わせる）
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # vitest + DB reset/migrate/seed（あなたの package.json にある test がこれをやる想定）
      - name: Unit/Integration tests
        run: pnpm test

      # E2E（playwright.config.ts の webServer が pnpm dev を起動する想定）
      - name: E2E tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7